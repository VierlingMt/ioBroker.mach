version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: cron
      cronjob: '17 4 9 * *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: cron
      cronjob: '43 5 9 * *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
