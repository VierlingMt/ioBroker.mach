name: Test and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}
  # Release per Knopfdruck (Actions → Test and Release → Run workflow):
  # setzt nur den Tag v<version>. Der Tag-Push startet danach den normalen
  # Lauf mit Tests, npm-Veröffentlichung und GitHub-Release – genau den
  # Lauf, den der ioBroker-Repochecker beim Tag erwartet.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, die veröffentlicht wird (muss in package.json stehen, z. B. 1.3.4)'
        required: true
        type: string

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          lint: false

  adapter-tests:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  # Knopfdruck: Version prüfen und Tag setzen. Der Tag wird mit
  # RELEASE_TOKEN gepusht – ein mit GITHUB_TOKEN gepushter Tag würde
  # absichtlich keinen weiteren Workflow-Lauf auslösen.
  create-tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check version and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Ungültige Version: $VERSION"; exit 1; }
          PKG=$(jq -r .version package.json)
          IOP=$(jq -r .common.version io-package.json)
          [[ "$PKG" == "$VERSION" && "$IOP" == "$VERSION" ]] || { echo "::error::package.json hat $PKG, io-package.json $IOP – erwartet $VERSION"; exit 1; }
          grep -q "^### $VERSION " README.md || { echo "::error::README-Changelog hat keinen Eintrag für $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION gibt es schon"; exit 1
          fi
          if curl -fsS -o /dev/null "https://registry.npmjs.org/iobroker.mach/$VERSION"; then
            echo "::error::Version $VERSION ist schon auf npm"; exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Tag v$VERSION gesetzt – der Tag-Lauf veröffentlicht jetzt."

  # Veröffentlicht auf npm, sobald ein Tag v1.2.3 gepusht wird – per
  # Trusted Publishing (OIDC), ohne gespeicherten npm-Token.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          github-token: ${{ secrets.GITHUB_TOKEN }}
