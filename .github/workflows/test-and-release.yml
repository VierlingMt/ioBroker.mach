name: Test and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}
  # Release per Knopfdruck (Actions → Test and Release → Run workflow):
  # startet das Release-Script (@alcalzone/release-script). Es erhöht die
  # Version in package.json und io-package.json, macht aus
  # "### **WORK IN PROGRESS**" im README den Versionseintrag, übernimmt ihn
  # übersetzt in common.news, committet und setzt den Tag v<version>.
  # Der Tag-Push startet danach den normalen Lauf mit Tests,
  # npm-Veröffentlichung und GitHub-Release.
  # Lokal geht dasselbe mit: npm run release patch (bzw. minor, major ...)
  workflow_dispatch:
    inputs:
      bump:
        description: 'Versionssprung'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: 'Kennung für Vorabversionen (nur bei pre*), z. B. beta'
        required: false
        default: 'beta'
        type: string

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          lint: true

  adapter-tests:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  # Knopfdruck: Release-Script ausführen. Commit und Tag werden mit
  # RELEASE_TOKEN gepusht – ein mit GITHUB_TOKEN gepushter Tag würde
  # absichtlich keinen weiteren Workflow-Lauf auslösen.
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run release script
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=("$BUMP")
          if [[ "$BUMP" == pre* && -n "$PREID" ]]; then
            ARGS+=("$PREID")
          fi
          npx release-script "${ARGS[@]}" --yes

  # Veröffentlicht auf npm, sobald ein Tag v1.2.3 gepusht wird – per
  # Trusted Publishing (OIDC), ohne gespeicherten npm-Token.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          github-token: ${{ secrets.GITHUB_TOKEN }}
