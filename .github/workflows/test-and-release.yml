name: Test and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}
  # Release per Knopfdruck (Actions → Test and Release → Run workflow):
  # testet, veröffentlicht auf npm und legt Tag v<version> samt Release an.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, die veröffentlicht wird (muss in package.json stehen, z. B. 1.3.4)'
        required: true
        type: string

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          lint: false

  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  # Veröffentlicht auf npm, sobald ein Tag v1.2.3 gepusht wird – per
  # Trusted Publishing (OIDC), ohne gespeicherten npm-Token.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: |
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/v') &&
       contains(github.event.head_commit.message, '[skip ci]') == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Beim Start per Knopf: die eingegebene Version muss zu package.json
      # passen und darf weder als Tag noch auf npm schon existieren.
      - name: Check release version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Ungültige Version: $VERSION"; exit 1; }
          PKG=$(curl -fsSL "https://raw.githubusercontent.com/$REPO/$REF/package.json" | jq -r .version)
          [[ "$PKG" == "$VERSION" ]] || { echo "::error::package.json hat $PKG, nicht $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION gibt es schon"; exit 1
          fi
          if curl -fsS -o /dev/null "https://registry.npmjs.org/iobroker.mach/$VERSION"; then
            echo "::error::Version $VERSION ist schon auf npm"; exit 1
          fi
          echo "Version $VERSION ok"

      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          # Bei Start per Knopf: legt Tag v<version> und das Release an.
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
